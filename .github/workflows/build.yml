name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            binary: build/mvnex
            executable: mvnex
            asset: mvnex-macos.zip
          - os: ubuntu-latest
            binary: build/mvnex
            executable: mvnex
            asset: mvnex-linux-x64.zip
          - os: windows-latest
            binary: build/Release/mvnex.exe
            executable: mvnex.exe
            asset: mvnex-windows-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        run: ${{ matrix.binary }} --version

      - name: Package binary
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          cmake -E make_directory dist/package
          cmake -E copy ${{ matrix.binary }} dist/package/${{ matrix.executable }}

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build/Release/*.dll dist/package/
          fi

          cd dist/package
          cmake -E tar cf ../${{ matrix.asset }} --format=zip .

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
